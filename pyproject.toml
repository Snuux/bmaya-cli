[project]
name = "bmaya-mcp"
version = "0.2.0"
description = "Lightweight MCP server for Autodesk Maya with a Blender-MCP-style tool surface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.urls]
Homepage = "https://github.com/Snuux/bmaya-mcp"
Repository = "https://github.com/Snuux/bmaya-mcp"
Issues = "https://github.com/Snuux/bmaya-mcp/issues"

[project.scripts]
bmaya-mcp = "bmaya_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmaya_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/bmaya_mcp/maya/python"]
