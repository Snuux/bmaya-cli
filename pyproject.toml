[project]
name = "bmaya-cli"
version = "0.11.0"
description = "Command-line tool that lets AI agents and scripts drive Autodesk Maya"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Snuux/bmaya-cli"
Repository = "https://github.com/Snuux/bmaya-cli"
Issues = "https://github.com/Snuux/bmaya-cli/issues"

[project.scripts]
bmaya = "bmaya_cli.cli:main"
bmaya-cli = "bmaya_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmaya_cli"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/bmaya_cli/maya/python"]
