<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171f"/>
      <stop offset="1" stop-color="#1d2230"/>
    </linearGradient>
    <linearGradient id="vp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7486"/>
      <stop offset="1" stop-color="#3b414d"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5328"/>
      <stop offset="0.45" stop-color="#d8995a"/>
      <stop offset="1" stop-color="#7a4520"/>
    </linearGradient>
    <clipPath id="vpclip">
      <rect x="700" y="40" width="540" height="300" rx="10"/>
    </clipPath>
    <style>
      .bounce { animation: bounce 1.6s cubic-bezier(.3,0,.7,1) infinite; transform-origin: 970px 300px; }
      @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1.06, 0.94); }
        12% { transform: translateY(-6px) scale(0.97, 1.04); }
        50% { transform: translateY(-58px) scale(1, 1); }
        88% { transform: translateY(-6px) scale(0.97, 1.04); }
      }
      .shadow { animation: shadow 1.6s cubic-bezier(.3,0,.7,1) infinite; transform-origin: 970px 300px; }
      @keyframes shadow {
        0%, 100% { transform: scale(1); opacity: .45; }
        50% { transform: scale(.7); opacity: .2; }
      }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .bounce, .shadow, .cursor { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="380" rx="18" fill="url(#bg)"/>

  <text x="70" y="138" font-size="72" font-weight="700" fill="#f2f4f8" letter-spacing="-1">bmaya<tspan fill="#f0a35a">-cli</tspan></text>
  <text x="72" y="184" font-size="24" fill="#aab3c5">Drive Autodesk Maya from the command line.</text>

  <rect x="70" y="216" width="560" height="116" rx="10" fill="#0e1016" stroke="#2c3240"/>
  <g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="17">
    <text x="92" y="251" fill="#7fd1a8">$</text>
    <text x="114" y="251" fill="#d6dbe6">bmaya scene</text>
    <text x="92" y="281" fill="#7fd1a8">$</text>
    <text x="114" y="281" fill="#d6dbe6">bmaya exec -f barrel.py</text>
    <text x="92" y="311" fill="#7fd1a8">$</text>
    <text x="114" y="311" fill="#d6dbe6">bmaya shot -o barrel.png</text>
  </g>
  <rect class="cursor" x="366" y="296" width="10" height="20" fill="#f0a35a"/>

  <g clip-path="url(#vpclip)">
    <rect x="700" y="40" width="540" height="300" fill="url(#vp)"/>
    <g stroke="#9aa3b3" stroke-width="1" opacity="0.5">
      <line x1="700" y1="250" x2="1240" y2="250"/>
      <line x1="700" y1="266" x2="1240" y2="266"/>
      <line x1="700" y1="288" x2="1240" y2="288"/>
      <line x1="700" y1="318" x2="1240" y2="318"/>
      <line x1="970" y1="250" x2="970" y2="340"/>
      <line x1="930" y1="250" x2="850" y2="340"/>
      <line x1="890" y1="250" x2="730" y2="340"/>
      <line x1="850" y1="250" x2="610" y2="340"/>
      <line x1="1010" y1="250" x2="1090" y2="340"/>
      <line x1="1050" y1="250" x2="1210" y2="340"/>
      <line x1="1090" y1="250" x2="1330" y2="340"/>
    </g>
    <line x1="970" y1="250" x2="970" y2="340" stroke="#e05a5a" stroke-width="1.5" opacity="0.7"/>
    <line x1="700" y1="288" x2="1240" y2="288" stroke="#5a8ae0" stroke-width="1.5" opacity="0.5"/>

    <ellipse class="shadow" cx="970" cy="300" rx="80" ry="16" fill="#000000"/>

    <g class="bounce">
      <path d="M 890 150 L 890 272 A 80 24 0 0 0 1050 272 L 1050 150 Z" fill="url(#wood)"/>
      <ellipse cx="970" cy="150" rx="80" ry="24" fill="#e3ab70"/>
      <g stroke="#5a3215" stroke-width="1" opacity="0.55" fill="none">
        <line x1="909" y1="164" x2="909" y2="286"/>
        <line x1="930" y1="171" x2="930" y2="293"/>
        <line x1="950" y1="174" x2="950" y2="296"/>
        <line x1="970" y1="174" x2="970" y2="296"/>
        <line x1="990" y1="174" x2="990" y2="296"/>
        <line x1="1010" y1="171" x2="1010" y2="293"/>
        <line x1="1031" y1="164" x2="1031" y2="286"/>
        <path d="M 890 211 A 80 24 0 0 0 1050 211"/>
      </g>
      <path d="M 890 178 A 80 24 0 0 0 1050 178" stroke="#2b2b30" stroke-width="5" fill="none"/>
      <path d="M 890 248 A 80 24 0 0 0 1050 248" stroke="#2b2b30" stroke-width="5" fill="none"/>
      <ellipse cx="970" cy="150" rx="80" ry="24" fill="none" stroke="#7fd1ff" stroke-width="1.5"/>
      <path d="M 890 150 L 890 272 A 80 24 0 0 0 1050 272 L 1050 150" fill="none" stroke="#7fd1ff" stroke-width="1.5"/>
      <path d="M 890 272 A 80 24 0 0 1 1050 272" fill="none" stroke="#7fd1ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    </g>

    <rect x="700" y="40" width="540" height="30" fill="#2a2f39" opacity="0.85"/>
    <text x="716" y="61" font-size="13" fill="#c9d0dc">persp</text>
    <text x="1224" y="61" font-size="13" fill="#c9d0dc" text-anchor="end" font-family="Cascadia Code, Consolas, Menlo, monospace">frame 1-24 · 24 fps</text>
    <g transform="translate(728 312)" font-size="11" font-weight="700">
      <line x1="0" y1="0" x2="18" y2="6" stroke="#e05a5a" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#6fd36f" stroke-width="2"/>
      <line x1="0" y1="0" x2="-14" y2="8" stroke="#5a8ae0" stroke-width="2"/>
      <text x="22" y="10" fill="#e05a5a">X</text>
      <text x="-4" y="-24" fill="#6fd36f">Y</text>
      <text x="-26" y="14" fill="#5a8ae0">Z</text>
    </g>
  </g>
  <rect x="700" y="40" width="540" height="300" rx="10" fill="none" stroke="#3a4152" stroke-width="2"/>
</svg>
