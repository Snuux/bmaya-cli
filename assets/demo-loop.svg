<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="192" viewBox="0 54 1200 192" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .step { fill: #1b1f29; stroke: #343b4b; stroke-width: 1.5; }
      .num { font-size: 13px; font-weight: 700; fill: #12151c; }
      .title { font-size: 18px; font-weight: 700; fill: #eef1f6; }
      .mono { font-family: Cascadia Code, Consolas, Menlo, monospace; font-size: 12.5px; fill: #8f99ac; }
      .glow { animation: glow 5s linear infinite; opacity: 0; }
      .g1 { animation-delay: 0s; }
      .g2 { animation-delay: 1s; }
      .g3 { animation-delay: 2s; }
      .g4 { animation-delay: 3s; }
      .g5 { animation-delay: 4s; }
      @keyframes glow { 0% { opacity: 0; } 4%, 18% { opacity: 1; } 24%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    </style>
  </defs>

  <rect y="54" width="1200" height="192" rx="18" fill="#12151c"/>

  <line x1="60" y1="150" x2="1140" y2="150" stroke="#2c3240" stroke-width="2"/>

  <g>
    <rect class="glow g1" x="36" y="82" width="200" height="136" rx="14" fill="none" stroke="#f0a35a" stroke-width="2"/>
    <rect class="step" x="40" y="86" width="192" height="128" rx="12"/>
    <circle cx="66" cy="112" r="12" fill="#f0a35a"/><text class="num" x="66" y="117" text-anchor="middle">1</text>
    <text class="title" x="88" y="118">Build</text>
    <text class="mono" x="58" y="152">bmaya exec</text>
    <text x="58" y="180" font-size="13" fill="#aab3c5">a low-poly barrel</text>
    <text x="58" y="198" font-size="13" fill="#aab3c5">with a material</text>
  </g>
  <g>
    <rect class="glow g2" x="263" y="82" width="200" height="136" rx="14" fill="none" stroke="#f0a35a" stroke-width="2"/>
    <rect class="step" x="267" y="86" width="192" height="128" rx="12"/>
    <circle cx="293" cy="112" r="12" fill="#f0a35a"/><text class="num" x="293" y="117" text-anchor="middle">2</text>
    <text class="title" x="315" y="118">Animate</text>
    <text class="mono" x="285" y="152">bmaya exec</text>
    <text x="285" y="180" font-size="13" fill="#aab3c5">keys a bounce and spin</text>
    <text x="285" y="198" font-size="13" fill="#aab3c5">over frames 1-24</text>
  </g>
  <g>
    <rect class="glow g3" x="490" y="82" width="200" height="136" rx="14" fill="none" stroke="#f0a35a" stroke-width="2"/>
    <rect class="step" x="494" y="86" width="192" height="128" rx="12"/>
    <circle cx="520" cy="112" r="12" fill="#f0a35a"/><text class="num" x="520" y="117" text-anchor="middle">3</text>
    <text class="title" x="542" y="118">Check</text>
    <text class="mono" x="512" y="152">bmaya audit / anim</text>
    <text x="512" y="180" font-size="13" fill="#aab3c5">n-gons, UVs, history,</text>
    <text x="512" y="198" font-size="13" fill="#aab3c5">names, curves and keys</text>
  </g>
  <g>
    <rect class="glow g4" x="717" y="82" width="200" height="136" rx="14" fill="none" stroke="#f0a35a" stroke-width="2"/>
    <rect class="step" x="721" y="86" width="192" height="128" rx="12"/>
    <circle cx="747" cy="112" r="12" fill="#f0a35a"/><text class="num" x="747" y="117" text-anchor="middle">4</text>
    <text class="title" x="769" y="118">Ship</text>
    <text class="mono" x="739" y="152">bmaya export</text>
    <text x="739" y="180" font-size="13" fill="#aab3c5">prop.fbx with</text>
    <text x="739" y="198" font-size="13" fill="#aab3c5">the Unity preset</text>
  </g>
  <g>
    <rect class="glow g5" x="944" y="82" width="220" height="136" rx="14" fill="none" stroke="#f0a35a" stroke-width="2"/>
    <rect class="step" x="948" y="86" width="212" height="128" rx="12"/>
    <circle cx="974" cy="112" r="12" fill="#f0a35a"/><text class="num" x="974" y="117" text-anchor="middle">5</text>
    <text class="title" x="996" y="118">Look</text>
    <text class="mono" x="966" y="152">bmaya shot --frames</text>
    <text x="966" y="180" font-size="13" fill="#aab3c5">a contact sheet of</text>
    <text x="966" y="198" font-size="13" fill="#aab3c5">four frames</text>
  </g>
</svg>
